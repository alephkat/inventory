name: inventory_app
description: Production-grade Mobile Inventory Management System built with Flutter, Dart, Clean Architecture, Riverpod, GoRouter, and Drift.
publish_to: 'none'

version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  # No `@riverpod` codegen is used: providers are plain
  # `flutter_riverpod` declarations, so `riverpod_generator` is intentionally
  # absent (it also pins an analyzer too old for this Dart SDK).
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  get_it: ^8.3.0
  injectable: ^2.5.1

  # Navigation
  go_router: ^15.1.2

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  internet_connection_checker: ^3.0.1
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.3.2

  # Local Storage
  drift: ^2.22.0
  drift_dev: ^2.22.0
  # `sqlite3_flutter` was a dead package; drift's native backend needs the
  # `sqlite3` Dart API plus `sqlite3_flutter_libs` for the bundled native
  # binary. 0.5.x is the line that matches `sqlite3` 2.x / drift 2.x --
  # 0.6.0+ is an intentional no-op for the sqlite3 3.x era.
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Secure Storage (sensitive credentials/tokens)
  flutter_secure_storage: ^10.3.4

  # Serialization
  # freezed 2.x / json_serializable 6.9 / drift_dev 2.28 /
  # injectable_generator 2.7 are the newest self-consistent generator set for
  # build_runner 2.5.x; do not jump to the analyzer-14 generation (build_runner
  # >= 2.15, freezed 4, injectable_generator 3) because those published
  # artifacts cannot generate a working build script here.
  json_annotation: ^4.9.0
  json_serializable: ^6.9.0
  freezed_annotation: ^2.4.1
  freezed: ^2.5.2
  equatable: ^2.0.5
  collection: ^1.17.0

  # Charts & Analytics
  fl_chart: ^0.71.0

  # Barcode / QR scanning
  mobile_scanner: ^6.0.11

  # Media / Files
  image_picker: ^1.1.2
  image: ^4.3.0
  pdf: ^3.10.4
  share_plus: ^12.0.2

  # Utilities
  dartz: ^0.10.1
  timezone: ^0.10.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  flutter_svg: ^2.0.0
  permission_handler: ^12.0.3
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.4.0
  # json_serializable, drift_dev and freezed are already listed under
  # dependencies; a duplicate dev_dependency only triggers a lint.

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/json/

# Run code generation after editing models:
#   flutter pub run build_runner build --delete-conflicting-outputs
